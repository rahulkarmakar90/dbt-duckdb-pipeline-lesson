[project]
name = "dbt-youtube"
version = "0.1.0"
description = "Learning DBT from Youtube"
readme = "README.md"
authors = [
    { name = "Rahul Karmakar", email = "rahul.karmakar.1990@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dbt>=2.0.12",
]

[project.scripts]
dbt-youtube = "dbt_youtube:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
