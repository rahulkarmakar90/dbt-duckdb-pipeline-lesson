name: dbt build & publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'    # Mondays — the pipeline runs while you sleep
  workflow_dispatch:        # …and a manual Run button
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # required to update the release
      pages: write          # required to upload the Pages artifact
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/download_data.py
      - run: uv run dbt build --profiles-dir ../ci
        working-directory: analytics
      - run: uv run dbt docs generate --profiles-dir ../ci
        working-directory: analytics
      - run: |
          mkdir -p site/project1
          cp -R analytics/target/. site/project1/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - run: |
          gh release create warehouse --notes "Warehouse — auto-built by dbt" || true
          gh release upload warehouse analytics/analytics_prod.duckdb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-docs:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
